[phases.setup]
nixPkgs = ["python39", "nodejs", "chromium"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium --with-deps"
]

[phases.build]
cmds = [
    "python manage.py collectstatic --noinput",
    "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn hisabpro.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 300"
